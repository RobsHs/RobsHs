<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 75" width="100%" height="75">
  <defs>
    <linearGradient id="fObsidian" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060103" />
      <stop offset="50%" stop-color="#0E0308" />
      <stop offset="100%" stop-color="#060103" />
    </linearGradient>

    <linearGradient id="fWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060103" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990024" />
      <stop offset="50%" stop-color="#FF003C" />
      <stop offset="100%" stop-color="#FF597B" />
    </linearGradient>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="900" height="75" rx="12" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }

    .footer-flow-1 {
      animation: fFlow 18s linear infinite;
    }
    .footer-flow-2 {
      animation: fFlow 12s linear infinite reverse;
    }
    @keyframes fFlow {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-450px, 0, 0); }
    }
  </style>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="900" height="75" fill="url(#fObsidian)" />
    
    <!-- Flowing ambient waves -->
    <g class="footer-flow-1" style="will-change: transform;">
      <path d="M 0 45.0 C 81.0 33.0, 144.0 33.0, 225.0 45.0 C 306.0 57.0, 369.0 57.0, 450.0 45.0 C 531.0 33.0, 594.0 33.0, 675.0 45.0 C 756.0 57.0, 819.0 57.0, 900.0 45.0 C 981.0 33.0, 1044.0 33.0, 1125.0 45.0 C 1206.0 57.0, 1269.0 57.0, 1350.0 45.0 C 1431.0 33.0, 1494.0 33.0, 1575.0 45.0 C 1656.0 57.0, 1719.0 57.0, 1800.0 45.0  L 1800 75 L 0 75 Z" fill="url(#fWaveGrad)" />
      <path d="M 0 45.0 C 81.0 33.0, 144.0 33.0, 225.0 45.0 C 306.0 57.0, 369.0 57.0, 450.0 45.0 C 531.0 33.0, 594.0 33.0, 675.0 45.0 C 756.0 57.0, 819.0 57.0, 900.0 45.0 C 981.0 33.0, 1044.0 33.0, 1125.0 45.0 C 1206.0 57.0, 1269.0 57.0, 1350.0 45.0 C 1431.0 33.0, 1494.0 33.0, 1575.0 45.0 C 1656.0 57.0, 1719.0 57.0, 1800.0 45.0 " fill="none" stroke="#FF003C" stroke-width="1.2" stroke-opacity="0.35" />
    </g>

    <g class="footer-flow-2" style="will-change: transform;">
      <path d="M 0 35.0 C 81.0 25.0, 144.0 25.0, 225.0 35.0 C 306.0 45.0, 369.0 45.0, 450.0 35.0 C 531.0 25.0, 594.0 25.0, 675.0 35.0 C 756.0 45.0, 819.0 45.0, 900.0 35.0 C 981.0 25.0, 1044.0 25.0, 1125.0 35.0 C 1206.0 45.0, 1269.0 45.0, 1350.0 35.0 C 1431.0 25.0, 1494.0 25.0, 1575.0 35.0 C 1656.0 45.0, 1719.0 45.0, 1800.0 35.0 " fill="none" stroke="url(#fRibbon)" stroke-width="1.6" stroke-opacity="0.6" />
    </g>
  </g>

  <rect x="1" y="1" width="898" height="73" rx="12" fill="none" stroke="#320C17" stroke-width="1.2" />

  <!-- Center Content -->
  <g transform="translate(450, 42)">
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#A1A1AA">
      <tspan fill="#FF003C" font-weight="800" class="mono" letter-spacing="1">ARTIFISIAL DEVELOPER</tspan>
      <tspan fill="#3F3F46"> • </tspan>
      <tspan fill="#E4E4E7" font-weight="600">Gi∞</tspan>
      <tspan fill="#71717A"> (@RobsHs)</tspan>
      <tspan fill="#3F3F46"> — </tspan>
      Architected with craft, accelerated by intelligence.
      <tspan fill="#3F3F46"> • </tspan>
      <tspan fill="#FF4D6D" class="mono" font-size="11">Pacitan, Indonesia</tspan>
    </text>
  </g>
</svg>