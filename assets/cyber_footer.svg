<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090507" />
      <stop offset="50%" stop-color="#0E0407" />
      <stop offset="100%" stop-color="#090507" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="62" rx="10" fill="url(#footerBg)" stroke="#2D0D16" stroke-width="1.2" />

  <!-- Center Content -->
  <g transform="translate(450, 36)">
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#A1A1AA">
      <tspan fill="#FF003C" font-weight="700" class="mono">ARTIFISIAL DEVELOPER</tspan>
      <tspan fill="#52525B"> — </tspan>
      Engineered with craftsmanship, augmented by intelligence.
      <tspan fill="#52525B"> • </tspan>
      <tspan fill="#71717A" class="mono">2026</tspan>
    </text>
  </g>
</svg>
