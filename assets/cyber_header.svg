<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Deep Obsidian Charcoal Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060103" />
      <stop offset="50%" stop-color="#0E0308" />
      <stop offset="100%" stop-color="#040102" />
    </linearGradient>

    <!-- Deep Ambient Crimson Aura Gradients -->
    <radialGradient id="auraLeft" cx="15%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#FF003C" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auraRight" cx="85%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#FF1A4E" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FF003C" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveFillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#B3002D" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050103" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveFillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#73001C" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#050103" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990024" />
      <stop offset="35%" stop-color="#FF003C" />
      <stop offset="70%" stop-color="#FF597B" />
      <stop offset="100%" stop-color="#FF003C" />
    </linearGradient>

    <linearGradient id="brightStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF758F" />
      <stop offset="50%" stop-color="#FFA4B8" />
      <stop offset="100%" stop-color="#FF4D6D" />
    </linearGradient>

    <!-- Glow Filter for Waves -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Base Card -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="220" rx="16" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }

    /* Flow Animations: Seamless Hardware-Accelerated Translations */
    .flow-wave-1 {
      animation: waveFlow 22s linear infinite;
    }
    .flow-wave-2 {
      animation: waveFlow 15s linear infinite reverse;
    }
    .flow-wave-3 {
      animation: waveFlow 10s linear infinite;
    }
    .flow-wave-4 {
      animation: waveFlow 18s linear infinite reverse;
    }

    @keyframes waveFlow {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-450px, 0, 0); }
    }

    .pulse-dot {
      animation: pulseAnim 2.2s ease-in-out infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .ambient-breathe {
      animation: breatheAnim 6s ease-in-out infinite;
    }
    @keyframes breatheAnim {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Base Card with Clip -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="900" height="220" fill="url(#obsidianBg)" />

    <!-- Ambient Breathing Crimson Auras -->
    <g class="ambient-breathe">
      <rect x="0" y="0" width="900" height="220" fill="url(#auraLeft)" />
      <rect x="0" y="0" width="900" height="220" fill="url(#auraRight)" />
    </g>

    <!-- LAYER 1: Deep Fluid Wave Fill (Slowest) -->
    <g class="flow-wave-1" style="will-change: transform;">
      <path d="M 0 140.0 C 81.0 114.0, 144.0 114.0, 225.0 140.0 C 306.0 166.0, 369.0 166.0, 450.0 140.0 C 531.0 114.0, 594.0 114.0, 675.0 140.0 C 756.0 166.0, 819.0 166.0, 900.0 140.0 C 981.0 114.0, 1044.0 114.0, 1125.0 140.0 C 1206.0 166.0, 1269.0 166.0, 1350.0 140.0 C 1431.0 114.0, 1494.0 114.0, 1575.0 140.0 C 1656.0 166.0, 1719.0 166.0, 1800.0 140.0  L 1800 220 L 0 220 Z" fill="url(#waveFillGrad1)" />
      <path d="M 0 140.0 C 81.0 114.0, 144.0 114.0, 225.0 140.0 C 306.0 166.0, 369.0 166.0, 450.0 140.0 C 531.0 114.0, 594.0 114.0, 675.0 140.0 C 756.0 166.0, 819.0 166.0, 900.0 140.0 C 981.0 114.0, 1044.0 114.0, 1125.0 140.0 C 1206.0 166.0, 1269.0 166.0, 1350.0 140.0 C 1431.0 114.0, 1494.0 114.0, 1575.0 140.0 C 1656.0 166.0, 1719.0 166.0, 1800.0 140.0 " fill="none" stroke="#FF003C" stroke-width="1.2" stroke-opacity="0.3" />
    </g>

    <!-- LAYER 2: Counter-Current Wave (Medium Speed) -->
    <g class="flow-wave-2" style="will-change: transform;">
      <path d="M 0 125.0 C 81.0 105.0, 144.0 105.0, 225.0 125.0 C 306.0 145.0, 369.0 145.0, 450.0 125.0 C 531.0 105.0, 594.0 105.0, 675.0 125.0 C 756.0 145.0, 819.0 145.0, 900.0 125.0 C 981.0 105.0, 1044.0 105.0, 1125.0 125.0 C 1206.0 145.0, 1269.0 145.0, 1350.0 125.0 C 1431.0 105.0, 1494.0 105.0, 1575.0 125.0 C 1656.0 145.0, 1719.0 145.0, 1800.0 125.0  L 1800 220 L 0 220 Z" fill="url(#waveFillGrad2)" />
      <path d="M 0 125.0 C 81.0 105.0, 144.0 105.0, 225.0 125.0 C 306.0 145.0, 369.0 145.0, 450.0 125.0 C 531.0 105.0, 594.0 105.0, 675.0 125.0 C 756.0 145.0, 819.0 145.0, 900.0 125.0 C 981.0 105.0, 1044.0 105.0, 1125.0 125.0 C 1206.0 145.0, 1269.0 145.0, 1350.0 125.0 C 1431.0 105.0, 1494.0 105.0, 1575.0 125.0 C 1656.0 145.0, 1719.0 145.0, 1800.0 125.0 " fill="none" stroke="url(#ribbonGrad)" stroke-width="2" stroke-opacity="0.65" filter="url(#crimsonGlow)" />
    </g>

    <!-- LAYER 3: Ethereal Ambient Wave -->
    <g class="flow-wave-4" style="will-change: transform;">
      <path d="M 0 115.0 C 81.0 103.0, 144.0 103.0, 225.0 115.0 C 306.0 127.0, 369.0 127.0, 450.0 115.0 C 531.0 103.0, 594.0 103.0, 675.0 115.0 C 756.0 127.0, 819.0 127.0, 900.0 115.0 C 981.0 103.0, 1044.0 103.0, 1125.0 115.0 C 1206.0 127.0, 1269.0 127.0, 1350.0 115.0 C 1431.0 103.0, 1494.0 103.0, 1575.0 115.0 C 1656.0 127.0, 1719.0 127.0, 1800.0 115.0 " fill="none" stroke="#FF2E63" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8,6" />
    </g>

    <!-- LAYER 4: Bright Glowing Energy Stream (Foreground Flow) -->
    <g class="flow-wave-3" style="will-change: transform;">
      <path d="M 0 155.0 C 81.0 140.0, 144.0 140.0, 225.0 155.0 C 306.0 170.0, 369.0 170.0, 450.0 155.0 C 531.0 140.0, 594.0 140.0, 675.0 155.0 C 756.0 170.0, 819.0 170.0, 900.0 155.0 C 981.0 140.0, 1044.0 140.0, 1125.0 155.0 C 1206.0 170.0, 1269.0 170.0, 1350.0 155.0 C 1431.0 140.0, 1494.0 140.0, 1575.0 155.0 C 1656.0 170.0, 1719.0 170.0, 1800.0 155.0 " fill="none" stroke="url(#brightStream)" stroke-width="2.2" stroke-opacity="0.85" filter="url(#crimsonGlow)" />
    </g>

    <!-- Subtle Floating Light Nodes along the Stream -->
    <g>
      <circle cx="210" cy="142" r="2.5" fill="#FFA4B8" opacity="0.8" />
      <circle cx="480" cy="158" r="3" fill="#FFFFFF" opacity="0.9" filter="url(#crimsonGlow)" />
      <circle cx="730" cy="128" r="2" fill="#FF758F" opacity="0.7" />
    </g>
  </g>

  <!-- Subtle Outer Border with Crimson Glow Accent -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#3A0D18" stroke-width="1.4" />

  <!-- LEFT: Bespoke Infinity-Flow Monogram Badge -->
  <g transform="translate(42, 54)">
    <!-- High-End Dark Squircle with Crimson Accent -->
    <rect x="0" y="0" width="102" height="102" rx="22" fill="#110307" stroke="#FF003C" stroke-width="1.4" stroke-opacity="0.8" filter="url(#crimsonGlow)" />
    <rect x="5" y="5" width="92" height="92" rx="18" fill="none" stroke="#FF2E63" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3,3" />

    <!-- Ambient Bloom Layer -->
    <path d="M 51 51 C 58 40, 70 36, 78 43 C 86 50, 86 52, 78 59 C 70 66, 58 62, 51 51 C 44 40, 32 36, 24 43 C 16 50, 16 52, 24 59 C 32 66, 44 62, 51 51 Z"
          fill="none"
          stroke="#FF003C"
          stroke-width="7.5"
          stroke-opacity="0.45"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#crimsonGlow)" />

    <!-- Vivid Neon Ribbon Layer -->
    <path d="M 51 51 C 58 40, 70 36, 78 43 C 86 50, 86 52, 78 59 C 70 66, 58 62, 51 51 C 44 40, 32 36, 24 43 C 16 50, 16 52, 24 59 C 32 66, 44 62, 51 51 Z"
          fill="none"
          stroke="url(#ribbonGrad)"
          stroke-width="3.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#crimsonGlow)" />

    <!-- Sharp Core Highlight Line -->
    <path d="M 51 51 C 58 40, 70 36, 78 43 C 86 50, 86 52, 78 59 C 70 66, 58 62, 51 51 C 44 40, 32 36, 24 43 C 16 50, 16 52, 24 59 C 32 66, 44 62, 51 51 Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.85" />

    <!-- Center Pulse Beacon -->
    <circle cx="51" cy="51" r="3" fill="#FFFFFF" class="pulse-dot" />
  </g>

  <!-- CENTER: Typographic Authority & Hierarchy -->
  <g transform="translate(168, 58)">
    <!-- Flag / Brand Tagline -->
    <g transform="translate(0, 0)">
      <!-- Glowing dot -->
      <circle cx="5" cy="8" r="4" fill="#FF003C" class="pulse-dot" />
      <text x="16" y="12" fill="#FF003C" class="mono" font-size="11.5" font-weight="700" letter-spacing="2">
        ARTIFISIAL DEVELOPER
      </text>
    </g>

    <!-- Main Identity Title -->
    <text x="0" y="48" fill="#FFFFFF" class="sans" font-size="34" font-weight="900" letter-spacing="-0.5">
      Gi∞ <tspan fill="#A1A1AA" font-weight="400" font-size="24">(@RobsHs)</tspan>
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="76" fill="#E4E4E7" class="sans" font-size="15" font-weight="500">
      Full-Stack Systems Architect &amp; AI Engineering
    </text>

    <!-- Philosophy Tagline -->
    <text x="0" y="98" fill="#8F8F9D" class="sans" font-size="12.5" font-style="italic">
      "Crafted with human vision, accelerated by artificial intelligence."
    </text>
  </g>

  <!-- RIGHT: Live Active Radar Beacon -->
  <g transform="translate(714, 48)">
    <rect x="0" y="0" width="146" height="30" rx="15" fill="#150408" stroke="#3D0E1A" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#FF003C" class="pulse-dot" />
    <text x="28" y="19" fill="#F4F4F5" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.5">
      LIVE &amp; SHIPPING
    </text>
  </g>
</svg>