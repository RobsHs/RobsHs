<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient (Obsidian to Deep Crimson Charcoal) -->
    <linearGradient id="bgGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050103" />
      <stop offset="50%" stop-color="#0f0307" />
      <stop offset="100%" stop-color="#040102" />
    </linearGradient>

    <!-- Neon Crimson Scarlet Gradient -->
    <linearGradient id="neonCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="50%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#FF758F" />
    </linearGradient>

    <!-- Dark Red Amber Accent -->
    <linearGradient id="bloodFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="50%" stop-color="#FF003C" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <!-- Subtle Crimson Grid Pattern -->
    <pattern id="gridRed" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FF003C" stroke-width="0.5" stroke-opacity="0.09" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTitleRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
    .bold-title { font-family: 'Consolas', 'Fira Code', monospace; font-weight: 900; letter-spacing: 4px; }
    .blink-red {
      animation: blinkerRed 1.2s infinite;
    }
    @keyframes blinkerRed {
      50% { opacity: 0.2; }
    }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="256" rx="10" fill="url(#bgGradRed)" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="2" y="2" width="896" height="256" rx="10" fill="url(#gridRed)" />

  <!-- Corner Tactical Crimson Brackets -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#FF003C" stroke-width="2.5" />
  <path d="M 888 30 L 888 12 L 870 12" fill="none" stroke="#FF003C" stroke-width="2.5" />
  <path d="M 12 230 L 12 248 L 30 248" fill="none" stroke="#FF003C" stroke-width="2.5" />
  <path d="M 888 230 L 888 248 L 870 248" fill="none" stroke="#FF003C" stroke-width="2.5" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="896" height="34" rx="10" fill="#130408" fill-opacity="0.9" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#FF003C" stroke-width="1" stroke-opacity="0.3" />

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="19" r="5" fill="#FF003C" filter="url(#glowRed)" />
  <circle cx="40" cy="19" r="5" fill="#FF8800" />
  <circle cx="56" cy="19" r="5" fill="#551122" />

  <!-- Header Info -->
  <text x="76" y="23" fill="#884455" class="mono" font-size="11" letter-spacing="1">HOST: <tspan fill="#FF2E63">ROBSHS-RED-PROTOCOL-01</tspan> [x86_64-linux]</text>
  <text x="540" y="23" fill="#884455" class="mono" font-size="11" letter-spacing="1">THREAT CLEARANCE: <tspan fill="#FF003C" font-weight="bold">UNRESTRICTED // ROOT</tspan></text>
  <text x="800" y="23" fill="#FF003C" class="mono" font-size="11" font-weight="bold" letter-spacing="1">[RED AURA]</text>

  <!-- Left Cyber Shield / Hex Crest -->
  <g transform="translate(35, 55)">
    <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#0C0205" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="45,8 82,30 82,74 45,96 8,74 8,30" fill="none" stroke="#FF2E63" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3,3" />
    <!-- Center Infinity Icon & Terminal Prompt -->
    <text x="45" y="55" fill="#FF003C" class="bold-title" font-size="32" text-anchor="middle" filter="url(#glowRed)">∞</text>
    <text x="45" y="76" fill="#FFAA00" class="mono" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1.5">Gi-CORE</text>
    <!-- Crosshairs -->
    <line x1="45" y1="-5" x2="45" y2="5" stroke="#FF003C" stroke-width="1.5" />
    <line x1="45" y1="99" x2="45" y2="109" stroke="#FF003C" stroke-width="1.5" />
  </g>

  <!-- Center Hero Typography -->
  <g transform="translate(155, 62)">
    <!-- Terminal Command Line -->
    <text x="0" y="16" fill="#FF003C" class="mono" font-size="13" letter-spacing="1.5">
      <tspan fill="#FF3366">root@robs-net</tspan>:<tspan fill="#FFAA00">~#</tspan> ./initialize_red_operative.sh --clearance=root
    </text>

    <!-- Main Subject Title -->
    <text x="0" y="56" fill="url(#neonCrimson)" class="bold-title" font-size="38" filter="url(#glowTitleRed)">
      GI∞ :: ROBBS-HS
    </text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="80" fill="#E2B4BD" class="mono" font-size="14" letter-spacing="2">
      [ <tspan fill="#FF003C" font-weight="bold">OFFENSIVE FULL-STACK ARCHITECT</tspan> ] • [ <tspan fill="#FFAA00">AUTONOMOUS AI SYSTEMS</tspan> ]
    </text>

    <!-- Ethos & Code Directive -->
    <text x="0" y="104" fill="#FFE5EC" class="mono" font-size="12" letter-spacing="1">
      DIRECTIVE: <tspan fill="#FF003C" font-weight="bold">"HIGH RISK. HIGH INCOME. EXECUTE WITHOUT PAUSE."</tspan>
    </text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(680, 56)">
    <rect x="0" y="0" width="185" height="110" rx="6" fill="#0C0205" stroke="#FF003C" stroke-width="1" stroke-opacity="0.4" />
    <text x="12" y="20" fill="#994455" class="mono" font-size="10" letter-spacing="1">// SYSTEM TELEMETRY</text>
    
    <circle cx="16" cy="38" r="4" fill="#FF003C" class="blink-red" />
    <text x="26" y="42" fill="#FFE5EC" class="mono" font-size="10">CORES: <tspan fill="#FF003C">100% OVERCLOCKED</tspan></text>

    <circle cx="16" cy="58" r="4" fill="#FF2E63" />
    <text x="26" y="62" fill="#FFE5EC" class="mono" font-size="10">LATENCY: <tspan fill="#FFAA00">&lt; 1ms [EDGE]</tspan></text>

    <circle cx="16" cy="78" r="4" fill="#FF003C" />
    <text x="26" y="82" fill="#FFE5EC" class="mono" font-size="10">THREAT DEFENSE: <tspan fill="#FF003C">ARMED</tspan></text>

    <line x1="10" y1="92" x2="175" y2="92" stroke="#FF003C" stroke-width="0.5" stroke-opacity="0.25" />
    <text x="12" y="103" fill="#884455" class="mono" font-size="9">PORT: 0.0.0.0:* [LISTEN]</text>
  </g>

  <!-- Bottom Metric & Tech Pill Strip -->
  <g transform="translate(25, 186)">
    <!-- Bar 1 -->
    <rect x="0" y="0" width="165" height="38" rx="4" fill="#130408" stroke="#FF003C" stroke-width="1" stroke-opacity="0.6" />
    <text x="12" y="16" fill="#994455" class="mono" font-size="9">PRIMARY WEAPONS</text>
    <text x="12" y="30" fill="#FF003C" class="mono" font-size="11" font-weight="bold">TS • REACT 19 • PY</text>

    <!-- Bar 2 -->
    <rect x="180" y="0" width="165" height="38" rx="4" fill="#130408" stroke="#FF2E63" stroke-width="1" stroke-opacity="0.6" />
    <text x="192" y="16" fill="#994455" class="mono" font-size="9">INTELLIGENCE STACK</text>
    <text x="192" y="30" fill="#FFAA00" class="mono" font-size="11" font-weight="bold">GEMINI • CLAUDE • GPT</text>

    <!-- Bar 3 -->
    <rect x="360" y="0" width="165" height="38" rx="4" fill="#130408" stroke="#FF3366" stroke-width="1" stroke-opacity="0.6" />
    <text x="372" y="16" fill="#994455" class="mono" font-size="9">ACTIVE REPOSITORIES</text>
    <text x="372" y="30" fill="#FF2E63" class="mono" font-size="11" font-weight="bold">QR-PRO • CMAKER • WIN98</text>

    <!-- Bar 4 -->
    <rect x="540" y="0" width="310" height="38" rx="4" fill="#130408" stroke="#FF003C" stroke-width="1" stroke-opacity="0.6" />
    <text x="552" y="16" fill="#994455" class="mono" font-size="9">SECURITY CLEARANCE &amp; HASH</text>
    <text x="552" y="30" fill="#FF003C" class="mono" font-size="10" font-weight="bold">SHA256: 9e8a...01bf [RED_ACCESS]</text>
  </g>

  <!-- Bottom Sub-line -->
  <line x1="25" y1="238" x2="875" y2="238" stroke="#FF003C" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4" />
  <text x="25" y="250" fill="#884455" class="mono" font-size="9" letter-spacing="1">CLASSIFIED RED OPERATIVE DOSSIER // GITHUB.COM/ROBSHS</text>
  <text x="830" y="250" fill="#FF003C" class="mono" font-size="9" font-weight="bold" letter-spacing="1">[RED v4.0]</text>
</svg>
