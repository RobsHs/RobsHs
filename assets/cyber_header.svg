<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient (Obsidian to Deep Crimson Charcoal) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060103" />
      <stop offset="50%" stop-color="#100308" />
      <stop offset="100%" stop-color="#050103" />
    </linearGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="neonCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="45%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#FFA2B8" />
    </linearGradient>

    <!-- Amber / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FF003C" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 2.5px; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="256" rx="10" fill="url(#bgGrad)" stroke="#FF003C" stroke-width="1.2" stroke-opacity="0.4" />
  <rect x="2" y="2" width="896" height="256" rx="10" fill="url(#techGrid)" />

  <!-- Corner Precision Accents -->
  <path d="M 14 28 L 14 14 L 28 14" fill="none" stroke="#FF003C" stroke-width="2" />
  <path d="M 886 28 L 886 14 L 872 14" fill="none" stroke="#FF003C" stroke-width="2" />
  <path d="M 14 232 L 14 246 L 28 246" fill="none" stroke="#FF003C" stroke-width="2" />
  <path d="M 886 232 L 886 246 L 872 246" fill="none" stroke="#FF003C" stroke-width="2" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="896" height="34" rx="10" fill="#140408" fill-opacity="0.9" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#FF003C" stroke-width="1" stroke-opacity="0.25" />

  <!-- Window Controls -->
  <circle cx="22" cy="19" r="4.5" fill="#FF003C" filter="url(#glowSubtle)" />
  <circle cx="36" cy="19" r="4.5" fill="#FFAA00" fill-opacity="0.8" />
  <circle cx="50" cy="19" r="4.5" fill="#44111E" />

  <!-- Header Metas -->
  <text x="70" y="23" fill="#A35467" class="mono" font-size="11" letter-spacing="1">SYSTEM: <tspan fill="#FF2E63">ARTIFISIAL-DEV-CORE</tspan> [v3.4-PRO]</text>
  <text x="530" y="23" fill="#A35467" class="mono" font-size="11" letter-spacing="1">LOCATION: <tspan fill="#FFE5EC">JAKARTA [UTC+7]</tspan></text>
  <text x="770" y="23" fill="#FF003C" class="mono" font-size="11" font-weight="bold" letter-spacing="1">[LIVE SYSTEM]</text>

  <!-- Left Identity Emblem: Hexagonal Neural Crest -->
  <g transform="translate(36, 58)">
    <polygon points="46,0 92,26 92,78 46,104 0,78 0,26" fill="#0E0206" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.75" />
    <polygon points="46,7 85,29 85,75 46,97 7,75 7,29" fill="none" stroke="#FF2E63" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
    
    <!-- Central Infinity & AI Emblem -->
    <text x="46" y="56" fill="#FF003C" class="mono" font-size="34" font-weight="900" text-anchor="middle" filter="url(#glowSubtle)">∞</text>
    <text x="46" y="78" fill="#FFB4C4" class="mono" font-size="9.5" font-weight="bold" text-anchor="middle" letter-spacing="2">GI•CORE</text>
    
    <!-- Precision Crosshairs -->
    <line x1="46" y1="-4" x2="46" y2="4" stroke="#FF003C" stroke-width="1.5" />
    <line x1="46" y1="100" x2="46" y2="108" stroke="#FF003C" stroke-width="1.5" />
    <line x1="-4" y1="52" x2="4" y2="52" stroke="#FF003C" stroke-width="1.5" />
    <line x1="88" y1="52" x2="96" y2="52" stroke="#FF003C" stroke-width="1.5" />
  </g>

  <!-- Center Content Block -->
  <g transform="translate(155, 66)">
    <!-- Subtitle Breadcrumb -->
    <text x="0" y="16" fill="#FF4D6D" class="mono" font-size="12" font-weight="bold" letter-spacing="1.5">
      // GI∞ (@ROBSHS) • PERSONAL ENGINEERING PORTFOLIO
    </text>

    <!-- Main Branding Title -->
    <text x="0" y="58" fill="url(#neonCrimson)" class="title" font-size="38" filter="url(#glowTitle)">
      ARTIFISIAL DEVELOPER
    </text>

    <!-- Professional Role -->
    <text x="0" y="86" fill="#F0F0F5" class="sans" font-size="16" font-weight="600" letter-spacing="0.5">
      AI-Augmented Full-Stack Architect &amp; Systems Engineer
    </text>

    <!-- Value Statement -->
    <text x="0" y="108" fill="#B08D97" class="sans" font-size="13" font-style="italic">
      "Bridging the speed of modern artificial intelligence with human craftsmanship and clean architecture."
    </text>

    <!-- Capability Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="24" rx="4" fill="#1C050B" stroke="#FF003C" stroke-width="1" stroke-opacity="0.6" />
      <text x="69" y="16" fill="#FFE5EC" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">⚡ AI &amp; AGENTS</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="156" height="24" rx="4" fill="#1C050B" stroke="#FF2E63" stroke-width="1" stroke-opacity="0.5" />
      <text x="224" y="16" fill="#FFE5EC" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">🌐 REACT 19 / NEXT.JS</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="150" height="24" rx="4" fill="#1C050B" stroke="#FF003C" stroke-width="1" stroke-opacity="0.6" />
      <text x="385" y="16" fill="#FFE5EC" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">🐍 PYTHON &amp; FASTAPI</text>

      <!-- Pill 4 -->
      <rect x="468" y="0" width="168" height="24" rx="4" fill="#1C050B" stroke="#FFAA00" stroke-width="1" stroke-opacity="0.5" />
      <text x="552" y="16" fill="#FFE5EC" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">🛡️ DEVSECOPS &amp; TOOLS</text>
    </g>
  </g>

  <!-- Right Side Minimal Telemetry Gauge -->
  <g transform="translate(810, 75)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#FF003C" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,4" />
    <circle cx="0" cy="20" r="3" fill="#FF003C" />
    <circle cx="0" cy="55" r="3" fill="#FF2E63" />
    <circle cx="0" cy="90" r="3" fill="#FFAA00" />
    <text x="12" y="24" fill="#A35467" class="mono" font-size="9">AI</text>
    <text x="12" y="59" fill="#A35467" class="mono" font-size="9">WEB</text>
    <text x="12" y="94" fill="#A35467" class="mono" font-size="9">SEC</text>
  </g>
</svg>
