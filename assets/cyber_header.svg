<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient (Clean Deep Obsidian with Subtle Crimson Radial) -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090507" />
      <stop offset="100%" stop-color="#040203" />
    </linearGradient>

    <!-- Subtle Radial Glow on the Right -->
    <radialGradient id="ambientCrimson" cx="85%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Subtle Text Gradient for Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFA4B8" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Base Card Container -->
  <rect x="1" y="1" width="898" height="178" rx="12" fill="url(#cardBg)" stroke="#2D0D16" stroke-width="1.2" />
  <!-- Ambient Soft Glow -->
  <rect x="1" y="1" width="898" height="178" rx="12" fill="url(#ambientCrimson)" />

  <!-- Left: Geometric Logo Mark -->
  <g transform="translate(40, 48)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="84" height="84" rx="16" fill="#130408" stroke="#FF003C" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Stylized Geometric Infinity & Core (Crafted Curves) -->
    <path d="M 28 42 C 28 35 34 31 39 36 C 44 41 46 43 51 48 C 56 53 62 49 62 42 C 62 35 56 31 51 36 C 46 41 44 43 39 48 C 34 53 28 49 28 42 Z" 
          fill="none" 
          stroke="url(#iconGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Accent Dot -->
    <circle cx="45" cy="42" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Middle: Typography Hierarchy -->
  <g transform="translate(148, 52)">
    <!-- Small Category Label -->
    <text x="0" y="14" fill="#FF003C" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      // ARTIFISIAL DEVELOPER
    </text>

    <!-- Main Name / Identity -->
    <text x="0" y="44" fill="url(#titleGrad)" class="sans" font-size="28" font-weight="800" letter-spacing="-0.5">
      Gi∞ <tspan fill="#71717A" font-weight="400">(@RobsHs)</tspan>
    </text>

    <!-- Role / Discipline -->
    <text x="0" y="68" fill="#A1A1AA" class="sans" font-size="14" font-weight="500">
      Full-Stack Software Architect &amp; AI Systems Engineer
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 84)">
      <text x="0" y="12" fill="#71717A" class="mono" font-size="11.5">
        TypeScript <tspan fill="#FF003C">•</tspan> Next.js <tspan fill="#FF003C">•</tspan> React 19 <tspan fill="#FF003C">•</tspan> Python <tspan fill="#FF003C">•</tspan> DevSecOps <tspan fill="#FF003C">•</tspan> Jakarta [UTC+7]
      </text>
    </g>
  </g>

  <!-- Right: Minimalist Status Pill -->
  <g transform="translate(710, 48)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#140408" stroke="#33101A" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#FF003C" />
    <text x="26" y="18" fill="#E4E4E7" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">BUILDING &amp; ACTIVE</text>
  </g>
</svg>
